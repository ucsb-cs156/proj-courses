name: "37-frontend-storybook-coverage: Report components without stories"

# Reports which React components and pages under frontend/src/main do not
# have a matching story under frontend/src/stories.  The report appears in
# the job summary of the workflow run (Actions tab -> this run -> Summary),
# and an HTML copy is published to this repo's GitHub Pages site at
# storybook-coverage/ (pushes to main) or prs/<PR number>/storybook-coverage/
# (pull requests); see the "Storybook Coverage" column on the site's index page.
#
# This is a thin wrapper around the reusable workflow in ucsb-cs156/workflows;
# see https://github.com/ucsb-cs156/workflows/blob/main/.github/workflows/37-frontend-storybook-coverage.yml
#
# By default this workflow only *reports*; it never fails the build.  Once
# every component has a story, add
#     with:
#       FAIL_ON_MISSING_STORIES: true
# under the `uses:` line below and the check will fail whenever coverage
# drops below 100%.

on:
  workflow_dispatch:
  pull_request:
    paths: [frontend/src/**, .github/workflows/37-frontend-storybook-coverage.yml]
  push:
    branches: [main]
    paths: [frontend/src/**, .github/workflows/37-frontend-storybook-coverage.yml]

# contents: write is needed to publish the HTML report to the gh-pages branch.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  call-frontend-storybook-coverage:
    uses: ucsb-cs156/workflows/.github/workflows/37-frontend-storybook-coverage.yml@main
